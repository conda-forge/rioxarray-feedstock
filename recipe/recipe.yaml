schema_version: 1

context:
  python_min: '3.12'
  version: 0.24.0

package:
  name: rioxarray
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rioxarray/rioxarray-${{ version }}.tar.gz
  sha256: b5ea51c4218e079c68e302f9cdb9ae4981a9ee6927f22d32a1abd9bb1eab929c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - rasterio >=1.5.1
    - xarray >=2026.2
    - pyproj >=3.7
    - numpy >=2.1
    - affine >=3
tests:
  - python:
      imports:
        - rioxarray
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: http://github.com/corteva/rioxarray
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: rasterio xarray extension.
  description: rasterio xarray extension.
  documentation: https://corteva.github.io/rioxarray
  repository: http://github.com/corteva/rioxarray

extra:
  recipe-maintainers:
    - snowman2
